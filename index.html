<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Планер</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A84FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">

<style>
:root{--bg:#F2F2F7;--card:#fff;--text:#000;--mut:#636366;--line:rgba(60,60,67,.18);--bar:rgba(249,249,249,.88);--seg:rgba(118,118,128,.12);--accent:#0A84FF;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1C1C1E;--text:#fff;--mut:#98989F;--line:rgba(84,84,88,.5);--bar:rgba(29,29,31,.88);--seg:rgba(118,118,128,.24);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1C1C1E;--text:#fff;--mut:#98989F;--line:rgba(84,84,88,.5);--bar:rgba(29,29,31,.88);--seg:rgba(118,118,128,.24);color-scheme:dark}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;padding-bottom:96px}
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding:8px 16px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;padding:8px 4px 4px}
.top h1{margin:0;font-size:34px;font-weight:700}
.lnk{color:var(--accent);padding:6px 4px}.ic{color:var(--accent);font-size:22px;padding:4px 8px}
.ds{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
.ds button{color:var(--accent);font-size:28px;width:44px;height:36px}
.ds #dt{font-weight:600;font-size:17px;flex:1;width:auto;white-space:nowrap;color:var(--text)}
.gt{font-size:13px;color:var(--mut);margin:0 16px 6px}
.grp{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:22px}
.cell{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:48px}
.cell+.cell{border-top:1px solid var(--line)}
.cell input[type=text],.cell textarea{flex:1;min-width:0;border:0;background:none;color:var(--text);font:inherit;outline:0;padding:0}
textarea{width:100%;min-height:96px;resize:vertical}
.col{flex-direction:column;align-items:stretch;gap:8px}
.row{display:flex;justify-content:space-between}
.bar{height:8px;border-radius:5px;background:var(--seg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.chk{position:relative;flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center;color:#fff;font-size:15px}
.chk.on{background:var(--accent);border-color:var(--accent)}
.d input[type=text]{color:var(--mut);text-decoration:line-through}
.tm{color:var(--accent);font-weight:600;font-size:15px}
.mut{color:var(--mut)}.grow{flex:1}.st{color:var(--mut);font-size:15px}.ctr{text-align:center}
.minus{position:relative;flex:none;width:32px;height:32px;border-radius:50%;background:#FF3B30;color:#fff;line-height:32px;font-weight:700}.chk::after,.minus::after{content:"";position:absolute;inset:-8px}.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#2C2C2E;color:#fff;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;z-index:15}#bn{margin:0 0 12px;padding:12px 14px;border-radius:12px;background:#FFF1C2;color:#4A3500;font-size:15px}
.add input[type=time]{width:96px;border:0;background:var(--seg);border-radius:8px;color:var(--text);font:inherit;padding:6px}
.plus{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;font-size:26px;line-height:40px}
.gl{display:flex;gap:8px;flex-wrap:wrap}
.g{width:32px;height:40px;border-radius:6px 6px 12px 12px;border:2px solid var(--accent)}.g.on{background:var(--accent)}
.moods{display:flex;gap:6px;width:100%}.m{flex:1;font-size:28px;padding:6px 0;border-radius:10px}.m.on{background:var(--seg)}
.bars{justify-content:space-between;gap:4px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--mut);padding:4px 0;border-radius:10px}
.bc.on{background:var(--seg);color:var(--text)}
.bt{height:80px;width:18px;border-radius:5px;background:var(--seg);display:flex;align-items:flex-end;overflow:hidden}
.bt i{display:block;width:100%;background:var(--accent);border-radius:5px}
.bc small{font-size:12px}
.seg{display:flex;background:var(--seg);border-radius:9px;padding:2px;margin-bottom:20px}
.seg button{flex:1;padding:6px 0;border-radius:7px;font-size:15px}
.seg .on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.ring{position:relative;width:260px;height:260px;margin:12px auto 24px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}.r0{stroke:var(--seg)}.r1{stroke:var(--accent);stroke-linecap:round}
#tt{position:absolute;inset:0;display:grid;place-items:center;font-size:54px;font-weight:300;font-variant-numeric:tabular-nums}
.btns{display:flex;gap:12px;margin-bottom:20px}
.big{flex:1;padding:14px;border-radius:14px;background:var(--accent);color:#fff;font-weight:600}
.big.alt{background:var(--seg);color:var(--text)}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mut)}
.tabbar span{font-size:22px;line-height:26px}.tabbar button.on{color:var(--accent)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;z-index:20}
.sb{width:100%;max-width:560px;margin:0 auto;background:var(--bg);border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sb h3{margin:0 0 14px;font-size:20px}
.sw{display:flex;gap:14px;margin:6px 4px 22px}.sw button{width:36px;height:36px;border-radius:50%}
.sw .on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--text)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
<div class="top"><h1 id="ttl"></h1><div><button class="lnk" id="edit">Змінити</button><button class="ic" id="gear" aria-label="Вигляд">⚙︎</button></div></div>
<div id="bn" hidden></div>
<div class="ds" id="ds"><button id="prev" aria-label="Назад">‹</button><button id="dt"></button><button id="next" aria-label="Вперед">›</button></div>
<div id="t-day"></div><div id="t-hab"></div><div id="t-week"></div><div id="t-foc"></div>
</main>
<nav class="tabbar">
<button id="tb-day"><span>📋</span>День</button><button id="tb-hab"><span>✅</span>Звички</button><button id="tb-week"><span>📊</span>Тиждень</button><button id="tb-foc"><span>⏱</span>Фокус</button>
</nav>
<div class="sheet" id="sheet" hidden><div class="sb" id="sb"></div></div>
<script>
const $=id=>document.getElementById(id);
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const K=d=>'planner:'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const rd=(k,f)=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):f}catch(e){return f}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){bn('Не вдалося зберегти запис. Збережіть копію: ⚙︎ → «Зберегти у файл».')}};
const blank=()=>({p:[{t:'',d:0},{t:'',d:0},{t:'',d:0}],tasks:[],w:0,mood:-1,notes:'',h:{},f:0});
const dd=d=>Object.assign(blank(),rd(K(d),{}));
let ST=Object.assign({theme:'auto',accent:'#0A84FF'},rd('planner:settings',{}));
if(!ST.firstRun){ST.firstRun=Date.now();wr('planner:settings',ST)}
let H=rd('planner:habits',[]),cur=new Date(),S,tab='day',E=false;
cur.setHours(12,0,0,0);
const save=()=>wr(K(cur),S);
function applyST(){const r=document.documentElement;ST.theme==='auto'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',ST.theme);r.style.setProperty('--accent',ST.accent)}
const pc=o=>{const a=o.p.filter(x=>x.t.trim()).concat(o.tasks);return a.length?Math.round(a.filter(x=>x.d).length/a.length*100):0};
function grp(par,title){if(title)par.append(mk('div','gt',title));const g=mk('div','grp');par.append(g);return g}
function cell(g){const c=mk('div','cell');g.append(c);return c}
function inp(val,ph,fn){const i=mk('input');i.type='text';i.value=val;i.placeholder=ph||'';i.oninput=()=>fn(i.value);return i}
function chk(on,fn){const b=mk('button','chk'+(on?' on':''),on?'✓':'');b.setAttribute('aria-label','Виконано');b.onclick=fn;return b}
function del(fn){const b=mk('button','minus','−');b.setAttribute('aria-label','Видалити');b.onclick=fn;return b}
function upd(){const p=pc(S);$('pcv').textContent=p+'%';$('pcb').style.width=p+'%'}

function rDay(){const v=$('t-day');v.innerHTML='';
 const c0=cell(grp(v));c0.classList.add('col');
 c0.innerHTML='<div class="row"><span>Виконано за день</span><b id="pcv"></b></div><div class="bar"><i id="pcb"></i></div>';
 const g1=grp(v,'Три головні цілі');
 S.p.forEach(o=>{const c=cell(g1);if(o.d)c.classList.add('d');c.append(chk(o.d,()=>{o.d=o.d?0:1;save();draw()}),inp(o.t,'Ціль дня',x=>{o.t=x;save();upd()}))});
 const g2=grp(v,'Справи й розклад');
 S.tasks.sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
 if(!S.tasks.length)cell(g2).append(mk('span','mut','Поки порожньо'));
 S.tasks.forEach((o,i)=>{const c=cell(g2);if(o.d)c.classList.add('d');
  if(E)c.append(del(()=>{const r=S.tasks.splice(i,1)[0];save();draw();toast('Справу видалено',()=>{S.tasks.push(r);save();draw()})}));
  c.append(chk(o.d,()=>{o.d=o.d?0:1;save();draw()}));if(o.time)c.append(mk('span','tm',o.time));
  c.append(inp(o.t,'',x=>{o.t=x;save()}))});
 const ca=cell(g2);ca.classList.add('add');const tx=inp('','Нова справа, час за бажанням',()=>{});const ti=mk('input');ti.type='time';ti.setAttribute('aria-label','Час, необов’язково');
 const ab=mk('button','plus','+');ab.setAttribute('aria-label','Додати');
 const ad=()=>{const t=tx.value.trim();if(!t)return;S.tasks.push({t,time:ti.value,d:0});save();draw()};
 ab.onclick=ad;tx.onkeydown=e=>{if(e.key==='Enter')ad()};ca.append(tx,ti,ab);
 if(S.tasks.some(t=>!t.d)){const c=cell(g2);const mv=mk('button','lnk','Перенести невиконане на завтра');
  mv.onclick=()=>{const tm=new Date(cur);tm.setDate(tm.getDate()+1);const o=dd(tm),un=S.tasks.filter(x=>!x.d);
   un.forEach(x=>o.tasks.push({t:x.t,time:x.time,d:0}));wr(K(tm),o);S.tasks=S.tasks.filter(x=>x.d);save();draw();toast('Перенесено на завтра: '+un.length)};c.append(mv)}
 const cw=cell(grp(v,'Вода'));const gl=mk('div','gl');
 for(let i=1;i<=8;i++){const b=mk('button','g'+(S.w>=i?' on':''));b.setAttribute('aria-label','Склянка '+i);b.onclick=()=>{S.w=S.w===i?i-1:i;save();draw()};gl.append(b)}
 cw.append(gl);
 const cm=cell(grp(v,'Настрій'));const mo=mk('div','moods');
 ['😞','😕','😐','🙂','😄'].forEach((e,i)=>{const b=mk('button','m'+(S.mood===i?' on':''),e);b.onclick=()=>{S.mood=S.mood===i?-1:i;save();draw()};mo.append(b)});
 cm.append(mo);
 const cn=cell(grp(v,'Нотатки'));const ta=mk('textarea');ta.placeholder='Думки, ідеї, підсумки дня…';ta.value=S.notes;ta.oninput=()=>{S.notes=ta.value;save()};cn.append(ta);
 upd()}

function streak(id){const d=new Date(cur);let n=0;if(!dd(d).h[id])d.setDate(d.getDate()-1);
 while(n<400&&dd(d).h[id]){n++;d.setDate(d.getDate()-1)}return n}
function rHab(){const v=$('t-hab');v.innerHTML='';const g=grp(v,'Щоденні звички');
 if(!H.length)cell(g).append(mk('span','mut','Додайте першу звичку, наприклад «Прогулянка»'));
 H.forEach((h,i)=>{const c=cell(g);
  if(E)c.append(del(()=>{const r=H.splice(i,1)[0];wr('planner:habits',H);draw();toast('Звичку видалено',()=>{H.splice(i,0,r);wr('planner:habits',H);draw()})}));
  c.append(chk(S.h[h.id],()=>{S.h[h.id]=S.h[h.id]?0:1;save();draw()}),mk('span','grow',h.n));
  const s=streak(h.id);if(s)c.append(mk('span','st','🔥 '+s))});
 const ca=cell(g);ca.classList.add('add');const tx=inp('','Нова звичка',()=>{});const ab=mk('button','plus','+');ab.setAttribute('aria-label','Додати');
 const ad=()=>{const t=tx.value.trim();if(!t)return;H.push({id:Date.now(),n:t});wr('planner:habits',H);draw()};
 ab.onclick=ad;tx.onkeydown=e=>{if(e.key==='Enter')ad()};ca.append(tx,ab)}

const mon=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
function rWeek(){const v=$('t-week');v.innerHTML='';const m=mon(cur);
 const days=[...Array(7)].map((_,i)=>{const x=new Date(m);x.setDate(m.getDate()+i);return x}),data=days.map(dd);
 const c=cell(grp(v,'Виконання по днях'));c.classList.add('bars');
 days.forEach((x,i)=>{const b=mk('button','bc'+(K(x)===K(cur)?' on':''));
  b.innerHTML='<div class="bt"><i style="height:'+Math.max(pc(data[i]),4)+'%"></i></div><span>'+x.toLocaleDateString('uk-UA',{weekday:'short'})+'</span><small>'+x.getDate()+'</small>';
  b.onclick=()=>{cur=x;S=dd(cur);show('day')};c.append(b)});
 const sum=f=>data.reduce((a,o)=>a+f(o),0),ms=data.filter(o=>o.mood>=0),em=['😞','😕','😐','🙂','😄'];
 const st=[['Завдань виконано',sum(o=>o.p.concat(o.tasks).filter(x=>x.d&&x.t.trim()).length)],['Звичок відмічено',sum(o=>Object.values(o.h).filter(Boolean).length)],['Склянок води',sum(o=>o.w)],['Сесій фокусу',sum(o=>o.f)],['Середній настрій',ms.length?em[Math.round(ms.reduce((a,o)=>a+o.mood,0)/ms.length)]:'—']];
 const g2=grp(v,'Підсумок тижня');st.forEach(([a,b])=>cell(g2).append(mk('span','grow',a),mk('b','',String(b))));
 const wk='planner:week:'+K(m),ta=mk('textarea');ta.placeholder='Що вдалося? Що змінити наступного тижня?';ta.value=rd(wk,'');ta.oninput=()=>wr(wk,ta.value);
 cell(grp(v,'Огляд тижня')).append(ta)}

let AC,WL;let F={dur:1500,left:1500,end:0,run:false,tm:null};
const fm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function ring(){const c=$('rc');if(c){c.style.strokeDasharray=339.3;c.style.strokeDashoffset=339.3*(1-F.left/F.dur)}const t=$('tt');if(t)t.textContent=fm(F.left)}
function stop(){clearInterval(F.tm);F.run=false;try{WL&&WL.release();WL=null}catch(e){}}
function tick(){F.left=Math.max(0,Math.ceil((F.end-Date.now())/1000));ring();
 if(F.left<=0){stop();const t=new Date(),o=dd(t);o.f++;wr(K(t),o);if(K(t)===K(cur))S.f=o.f;beep();try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}F.left=F.dur;draw()}}
function toggle(){if(F.run){stop();draw();return}try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}lock();F.end=Date.now()+F.left*1000;F.run=true;F.tm=setInterval(tick,250);draw()}
function rFoc(){const v=$('t-foc');v.innerHTML='';const seg=mk('div','seg');
 [15,25,45,60].forEach(m=>{const b=mk('button',F.dur===m*60?'on':'',m+' хв');b.onclick=()=>{if(F.run)return;F.dur=F.left=m*60;draw()};seg.append(b)});v.append(seg);
 const w=mk('div','ring');w.innerHTML='<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" class="r0"/><circle id="rc" cx="60" cy="60" r="54" class="r1"/></svg><div id="tt"></div>';v.append(w);
 const bs=mk('div','btns'),rs=mk('button','big alt','Скинути'),go=mk('button','big',F.run?'Пауза':(F.left<F.dur?'Продовжити':'Старт'));
 rs.onclick=()=>{stop();F.left=F.dur;draw()};go.onclick=toggle;bs.append(rs,go);v.append(bs);
 v.append(mk('div','mut ctr','Сесій сьогодні: '+dd(new Date()).f));ring()}

const TT={day:'День',hab:'Звички',week:'Тиждень',foc:'Фокус'};
function rDates(){const f=(d,o)=>d.toLocaleDateString('uk-UA',o);
 if(tab==='week'){const m=mon(cur),e=new Date(m);e.setDate(m.getDate()+6);$('dt').textContent=f(m,{day:'numeric',month:'short'})+' – '+f(e,{day:'numeric',month:'short'})}
 else $('dt').textContent=(K(cur)===K(new Date())?'Сьогодні, ':f(cur,{weekday:'long'})+', ')+f(cur,{day:'numeric',month:'long'})}
function draw(){const y=scrollY;({day:rDay,hab:rHab,week:rWeek,foc:rFoc})[tab]();scrollTo(0,y)}
function show(t){tab=t;E=false;
 ['day','hab','week','foc'].forEach(k=>{$('t-'+k).hidden=k!==t;$('tb-'+k).classList.toggle('on',k===t)});
 $('ttl').textContent=TT[t];$('ds').hidden=t==='foc';$('edit').hidden=!(t==='day'||t==='hab');$('edit').textContent='Змінити';
 rDates();draw();scrollTo(0,0)}
function go(n){cur.setDate(cur.getDate()+n*(tab==='week'?7:1));S=dd(cur);rDates();draw()}
function sheet(){$('sheet').hidden=false;const b=$('sb');b.innerHTML='<h3>Вигляд</h3>';const seg=mk('div','seg');
 [['auto','Авто'],['light','Світла'],['dark','Темна']].forEach(([k,l])=>{const x=mk('button',ST.theme===k?'on':'',l);x.onclick=()=>{ST.theme=k;wr('planner:settings',ST);applyST();sheet()};seg.append(x)});b.append(seg);
 b.append(mk('div','gt','Колір акценту'));const sw=mk('div','sw');
 ['#0A84FF','#30B0A0','#34C759','#FF9F0A','#FF375F','#AF52DE'].forEach(c=>{const x=mk('button',ST.accent===c?'on':'');x.style.background=c;x.setAttribute('aria-label',c);x.onclick=()=>{ST.accent=c;wr('planner:settings',ST);applyST();sheet()};sw.append(x)});b.append(sw);
 b.append(mk('div','gt','Резервна копія'));
 const bk=mk('div','btns');const ex=mk('button','big alt','Зберегти у файл'),im=mk('button','big alt','Відновити з файлу');
 ex.onclick=exportData;im.onclick=()=>$('imp').click();bk.append(ex,im);b.append(bk);
 const ok=mk('button','big','Готово');ok.onclick=()=>{$('sheet').hidden=true};b.append(ok)}
['day','hab','week','foc'].forEach(k=>$('tb-'+k).onclick=()=>show(k));
$('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
$('dt').onclick=()=>{cur=new Date();cur.setHours(12,0,0,0);S=dd(cur);rDates();draw()};
$('edit').onclick=()=>{E=!E;$('edit').textContent=E?'Готово':'Змінити';draw()};
$('gear').onclick=sheet;$('sheet').onclick=e=>{if(e.target.id==='sheet')e.target.hidden=true};
const fi=mk('input');fi.type='file';fi.id='imp';fi.accept='.json,application/json';fi.hidden=true;document.body.append(fi);
function exportData(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.indexOf('planner:')===0)o[k]=localStorage.getItem(k)}
 const name='planner-'+K(new Date()).replace('planner:','')+'.json',txt=JSON.stringify(o),done=()=>{ST.lastBackup=Date.now();wr('planner:settings',ST);$('bn').hidden=true};
 try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Копія планера'}).then(done).catch(()=>{});return}}catch(e){}
 const blob=new Blob([txt],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);done()}
fi.onchange=()=>{const f=fi.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);let n=0;
 Object.keys(o).forEach(k=>{if(k.indexOf('planner:')===0){localStorage.setItem(k,o[k]);n++}});
 alert('Відновлено записів: '+n);location.reload()}catch(e){alert('Не вдалося прочитати файл')}};r.readAsText(f);fi.value=''};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(()=>{})}
function bn(t,act){const b=$('bn');b.hidden=false;b.textContent=t;b.onclick=act||null;b.style.cursor=act?'pointer':'default'}
let TO;function toast(t,fn){let b=$('toast');if(!b){b=mk('div','toast');b.id='toast';document.body.append(b)}
 b.innerHTML='';b.hidden=false;b.append(mk('span','',t));
 if(fn){const u=mk('button','','Скасувати');u.style.cssText='color:#8AB8FF;font-weight:600;padding:8px';u.onclick=()=>{b.hidden=true;fn()};b.append(u)}
 clearTimeout(TO);TO=setTimeout(()=>{b.hidden=true},6000)}
async function lock(){try{if(navigator.wakeLock)WL=await navigator.wakeLock.request('screen')}catch(e){}}
function beep(){try{if(!AC)return;[0,.35,.7].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.2)})}catch(e){}}
let TD=K(new Date());
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;if(F.run)lock();
 const n=K(new Date());if(n!==TD){const was=K(cur)===TD;TD=n;if(was){cur=new Date();cur.setHours(12,0,0,0);S=dd(cur);rDates();draw()}}});
applyST();S=dd(cur);show('day');
if(Date.now()-(ST.lastBackup||ST.firstRun)>6048e5)bn('Минув тиждень без резервної копії. Торкніться, щоб зберегти.',sheet);
